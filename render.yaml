# Render Blueprint：一次建立網站伺服器（Docker + 持久化磁碟）與 PostgreSQL。
# 使用方式：Render Dashboard → New → Blueprint → 選擇此 GitHub 儲存庫。
# 標記 sync: false 的變數會在建立時由你在 Render 介面輸入（不寫入 Git）。
services:
  - type: web
    name: ata-coffee
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: ata-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ata-coffee-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /app/storage
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: ata-coffee-db
    plan: basic-256mb
    region: singapore
    databaseName: ata_coffee
    user: ata
    postgresMajorVersion: "16"
    diskSizeGB: 1
